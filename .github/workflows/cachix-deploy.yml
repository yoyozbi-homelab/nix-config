name: "Cachix Deploy"

on: # yamllint disable-line rule:truthy
  workflow_dispatch: # allows manual triggering
    inputs:
      force:
        description: "Deploy even if server configs are unchanged"
        type: boolean
        default: false
  push:
    branches:
      - main

env:
  CACHE_NAME: homelab-yohan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: blacksmith-8vcpu-ubuntu-2404
          - system: aarch64-linux
            runner: blacksmith-8vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The spec's .drvPath is a content hash of everything that goes into the
      # servers of this system, so it changes iff one of them changes. Arion uses
      # import-from-derivation, so this has to evaluate on a native runner.
      # Assigned on its own line so a failed eval fails the step.
      - name: Compute spec hash
        id: spec
        run: |
          drv=$(nix eval --raw ".#defaultPackage.${{ matrix.system }}.drvPath")
          echo "hash=$(basename "$drv")" >> "$GITHUB_OUTPUT"

      # A cache hit means this exact spec was already deployed -> skip.
      - name: Check deploy state
        id: state
        uses: actions/cache/restore@v6
        with:
          path: .deploy-marker
          key: cachix-deploy-${{ matrix.system }}-${{ steps.spec.outputs.hash }}
          lookup-only: true

      - name: Build and push spec
        id: build
        if: inputs.force || steps.state.outputs.cache-hit != 'true'
        run: |
          spec=$(nix build --print-out-paths ".#defaultPackage.${{ matrix.system }}")
          cachix push "$CACHE_NAME" "$spec"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: inputs.force || steps.state.outputs.cache-hit != 'true'
        timeout-minutes: 30
        env:
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
        run: cachix deploy activate "${{ steps.build.outputs.spec }}"

      # Only recorded once the hosts have deployed, so failed runs get retried.
      - name: Record deployed state
        if: inputs.force || steps.state.outputs.cache-hit != 'true'
        run: touch .deploy-marker

      - uses: actions/cache/save@v6
        if: inputs.force || steps.state.outputs.cache-hit != 'true'
        with:
          path: .deploy-marker
          key: cachix-deploy-${{ matrix.system }}-${{ steps.spec.outputs.hash }}
